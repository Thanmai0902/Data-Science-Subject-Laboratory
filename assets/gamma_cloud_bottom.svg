<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bottomCloudShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="-10" stdDeviation="18" flood-color="#7C3AED" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="cloudGradB" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="45%" stop-color="#F472B6"/>
      <stop offset="80%" stop-color="#FED7AA"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <g filter="url(#bottomCloudShadow)">
    <path d="M-40 300 
             L-40 180 
             C-20 150, 20 140, 50 160 
             C70 110, 130 90, 180 120 
             C210 80, 270 85, 300 130 
             C335 140, 360 170, 350 210 
             C370 240, 350 280, 310 300 
             Z" 
          fill="url(#cloudGradB)" opacity="0.95" />
    <circle cx="100" cy="180" r="50" fill="#FED7AA" opacity="0.5"/>
    <circle cx="210" cy="160" r="65" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>
