<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Science Subject Laboratory | MBU</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header style="position: sticky; top: 0; background: var(--card-bg); z-index: 1000; box-shadow: var(--shadow-sm);">
        <div class="container header-content" style="display: flex; justify-content: space-between; align-items: center; padding: 10px 20px;">
            <div class="header-left">
                <img src="" alt="MBU Logo" class="header-logo config-mbu-logo" style="height: 30px;">
            </div>
            <div class="header-center" style="font-weight: 700; color: var(--primary-color); font-size: 1.1rem; letter-spacing: 1px; display: flex; align-items: center; gap: 10px;">
                <img src="https://media.istockphoto.com/id/1392726957/vector/data-science-icon-line-style-element-from-data-organization-collection-thin-data-science.jpg?s=612x612&w=0&k=20&c=uMAXCDbPMgvpHY3yc-La0oFfUzkJzzE5Q6haD8Idb5E=" alt="Data Science Logo" style="height: 28px; mix-blend-mode: multiply;">
                DATA SCIENCE SUBJECT LABORATORY
            </div>
            <div class="header-right">
                <nav style="display: flex; gap: 25px;">
                    <a href="index.html" style="text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.95rem; transition: color 0.2s;">Profile</a>
                    <a href="tools.html" style="text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.95rem; transition: color 0.2s;">Tools</a>
                    <a href="editor.html" style="text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.95rem; transition: color 0.2s;">Editor</a>
                    <a href="modules.html" style="text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.95rem; transition: color 0.2s;">Modules</a>
                    <a href="experiments.html" style="text-decoration: none; color: var(--text-main); font-weight: 600; font-size: 0.95rem; transition: color 0.2s;">Experiments</a>
                </nav>
            </div>
        </div>
    </header>

    <div class="container">
        <!-- Editor Section -->
        <section id="editor" class="editor-section" style="margin-top: 60px; margin-bottom: 50px; scroll-margin-top: 100px;">
            <h2 class="section-title" style="margin-bottom: 20px; font-size: 1.2rem; color: var(--text-muted); letter-spacing: 1px;">CODE SANDBOX</h2>
            <div class="card" style="padding: 0; overflow: hidden; border: 1px solid var(--border-color); display: flex; flex-direction: column; background: #282a36;">
                <div style="background-color: #1E293B; padding: 12px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center;">
                    <div style="display: flex; gap: 10px; align-items: center;">
                        <span style="font-weight: 600; font-size: 0.9rem; color: #F8FAFC;">main.py</span>
                        <span style="font-size: 0.8rem; color: #94A3B8; background: rgba(255,255,255,0.1); padding: 2px 8px; border-radius: 10px;">Python 3</span>
                    </div>
                    <button class="btn-primary" style="margin-top: 0; padding: 6px 16px; font-size: 0.9rem; background-color: var(--primary-color); color: white; font-weight: 600; display: flex; align-items: center; gap: 5px; box-shadow: none;" onclick="runCode()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Run Code
                    </button>
                </div>
                <div id="code-editor" style="height: 350px; width: 100%; font-size: 15px;"></div>
                <div style="background-color: #0F172A; color: #C8E64A; padding: 15px; font-family: monospace; height: 180px; overflow-y: auto; border-top: 1px solid var(--border-color); font-size: 0.9rem;" id="code-output">
                    > Terminal ready.<br>> Write your python code above and click 'Run Code'.
                </div>
            </div>
        </section>

        </div>

    <!-- Add Experiment Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content large">
            <span class="close-modal" onclick="closeModal('addModal')">&times;</span>
            <h2 style="margin-bottom: 20px; color: var(--primary-color);">Add New Experiment</h2>
            
            <form id="addExperimentForm">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="form-group">
                        <label>Experiment Number</label>
                        <input type="text" id="expNum" class="form-control" required placeholder="e.g. EXPERIMENT 03">
                    </div>
                    <div class="form-group">
                        <label>Experiment Title</label>
                        <input type="text" id="expTitle" class="form-control" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Short Description</label>
                    <input type="text" id="expDesc" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Aim</label>
                    <textarea id="expAim" class="form-control" required></textarea>
                </div>

                <div class="form-group">
                    <label>Objective</label>
                    <textarea id="expObj" class="form-control" required></textarea>
                </div>

                <div class="form-group">
                    <label>Theory</label>
                    <textarea id="expTheory" class="form-control" required></textarea>
                </div>

                <div class="form-group">
                    <label>Requirements</label>
                    <input type="text" id="expReq" class="form-control" required>
                </div>

                <div class="form-group">
                    <label>Procedure</label>
                    <textarea id="expProc" class="form-control" required></textarea>
                </div>

                <div class="form-group">
                    <label>Python Code</label>
                    <textarea id="expCode" class="form-control" style="font-family: monospace;" required></textarea>
                </div>

                <div class="form-group">
                    <label>Result</label>
                    <textarea id="expResult" class="form-control" required></textarea>
                </div>

                <div style="display: flex; justify-content: flex-end; gap: 15px; margin-top: 20px;">
                    <button type="button" class="btn-outline" onclick="closeModal('addModal')">Cancel</button>
                    <button type="submit" class="btn-primary">Save Experiment</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/experiments.js"></script>
    <script src="js/main.js"></script>

    <!-- Code Editor Setup -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.32.3/ace.js"></script>
    <script>
        // Code Editor
        document.addEventListener('DOMContentLoaded', () => {
            if(document.getElementById('code-editor')) {
                var editor = ace.edit("code-editor");
                editor.setTheme("ace/theme/dracula");
                editor.session.setMode("ace/mode/python");
                editor.setValue("# Write your Python code here\nimport pandas as pd\nimport numpy as np\n\nprint('Data Science Subject Laboratory Sandbox Initialized!')\n\n# Example:\n# df = pd.DataFrame({'A': [1, 2], 'B': [3, 4]})\n# print(df.head())\n");
                editor.clearSelection();
                editor.setFontSize("15px");
                
                window.runCode = function() {
                    const output = document.getElementById('code-output');
                    output.innerHTML += '<br><br>> Running script...<br>> [Output] execution simulated successfully in local browser!<br>> Data Science Subject Laboratory Sandbox Initialized!';
                    output.scrollTop = output.scrollHeight;
                    
                    // Flash the terminal background to show it did something
                    output.style.backgroundColor = '#1e293b';
                    setTimeout(() => {
                        output.style.backgroundColor = '#0F172A';
                    }, 200);
                }
            }
        });
    </script>

    <!-- Chart.js Setup -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        let growthChartInstance = null;

        function initChart() {
            const canvas = document.getElementById('growthChart');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            
            // If chart exists, destroy it so we can re-animate it from scratch
            if (growthChartInstance) {
                growthChartInstance.destroy();
            }

            // Gradient for the line
            const gradient = ctx.createLinearGradient(0, 0, 0, 200);
            gradient.addColorStop(0, 'rgba(180, 133, 246, 0.5)'); // Lavender
            gradient.addColorStop(1, 'rgba(180, 133, 246, 0.0)'); // Transparent

            growthChartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Sem 1', 'Sem 2', 'Sem 3', 'Sem 4'],
                    datasets: [{
                        label: 'Overall Performance',
                        data: [72, 78, 85, 92], // Simulating growth
                        borderColor: '#111111', // Black line
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointBackgroundColor: '#B485F6', // Lavender point
                        pointBorderColor: '#111111', // Black border
                        pointBorderWidth: 2,
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        fill: true,
                        tension: 0.4 // Smooth curve
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: {
                        duration: 1500,
                        easing: 'easeOutQuart'
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#FAF9F6',
                            titleColor: '#211A20',
                            bodyColor: '#211A20',
                            borderColor: '#B5D13E',
                            borderWidth: 1,
                            padding: 10,
                            displayColors: false,
                            callbacks: {
                                label: function(context) {
                                    return context.parsed.y + ' Marks';
                                }
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: false,
                            min: 60,
                            max: 100,
                            grid: {
                                color: 'rgba(33, 26, 32, 0.05)',
                                drawBorder: false,
                            },
                            ticks: {
                                color: '#645561',
                                stepSize: 10
                            }
                        },
                        x: {
                            grid: {
                                display: false,
                                drawBorder: false,
                            },
                            ticks: {
                                color: '#645561'
                            }
                        }
                    }
                }
            });
        }

        document.addEventListener('DOMContentLoaded', initChart);

        // Click handler to re-trigger the animation
        window.animateChart = function() {
            initChart();
        };
    </script>
</body>
</html>
